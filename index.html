<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RushBite POS Trainer</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg: #111315;
        --panel: #191c1f;
        --panel2: #202428;
        --panel3: #292e33;
        --border: #343a40;
        --text: #f4f5f6;
        --muted: #9299a1;
        --accent: #ff9f1c;
        --accent2: #ffb84d;
        --green: #43d17a;
        --red: #ff5c5c;
        --blue: #5da9ff;
        --yellow: #ffd166;
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        overflow: hidden;
    }

    button {
        font: inherit;
    }

    .app {
        height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
        height: 70px;
        background: #0d0f10;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 22px;
        gap: 25px;
        flex-shrink: 0;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 220px;
    }

    .brand-logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--accent);
        color: #111;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 19px;
    }

    .brand-name {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -.3px;
    }

    .brand-sub {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
    }

    .top-stats {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
    }

    .stat {
        padding: 8px 13px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 9px;
        min-width: 100px;
    }

    .stat-label {
        font-size: 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .7px;
    }

    .stat-value {
        font-size: 15px;
        font-weight: 750;
        margin-top: 2px;
    }

    .clock {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
    }

    /* =====================================================
       MAIN
    ===================================================== */

    .main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 290px 1fr 390px;
        gap: 0;
    }

    /* =====================================================
       LEFT QUEUE
    ===================================================== */

    .queue-panel {
        border-right: 1px solid var(--border);
        background: #151719;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .panel-header {
        height: 62px;
        padding: 0 17px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
    }

    .panel-title {
        font-weight: 800;
        font-size: 14px;
    }

    .badge {
        background: var(--panel3);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 4px 9px;
        font-size: 11px;
        font-weight: 700;
    }

    .queue-list {
        padding: 12px;
        overflow-y: auto;
        flex: 1;
    }

    .queue-card {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 11px;
        padding: 13px;
        margin-bottom: 9px;
        cursor: pointer;
        transition: .15s;
    }

    .queue-card:hover {
        border-color: #555d65;
        transform: translateY(-1px);
    }

    .queue-card.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(255,159,28,.15);
    }

    .queue-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 7px;
    }

    .queue-mode {
        font-size: 10px;
        font-weight: 800;
        color: var(--accent2);
        text-transform: uppercase;
        letter-spacing: .7px;
    }

    .queue-time {
        font-size: 11px;
        color: var(--muted);
    }

    .queue-request {
        color: #d8dadd;
        font-size: 12px;
        line-height: 1.45;
    }

    .patience {
        height: 4px;
        background: #30353a;
        border-radius: 10px;
        margin-top: 10px;
        overflow: hidden;
    }

    .patience-fill {
        height: 100%;
        background: var(--green);
        transition: width 1s linear;
    }

    .patience-fill.warning {
        background: var(--yellow);
    }

    .patience-fill.danger {
        background: var(--red);
    }

    .queue-footer {
        padding: 12px;
        border-top: 1px solid var(--border);
    }

    .new-order-btn {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 9px;
        background: var(--accent);
        color: #111;
        font-weight: 850;
        cursor: pointer;
    }

    .new-order-btn:hover {
        background: var(--accent2);
    }

    /* =====================================================
       CENTER
    ===================================================== */

    .workspace {
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: #121416;
    }

    .request-area {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        background: #16191b;
    }

    .request-ticket {
        background: #202428;
        border: 1px solid #3b4147;
        border-left: 4px solid var(--accent);
        border-radius: 10px;
        padding: 14px 16px;
    }

    .request-ticket.correct {
        border-left-color: var(--green);
    }

    .request-ticket.incorrect {
        border-left-color: var(--red);
    }

    .request-label {
        color: var(--accent);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .request-text {
        font-size: 15px;
        line-height: 1.45;
        font-weight: 600;
    }

    .request-status {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
    }

    .request-status.success {
        color: var(--green);
    }

    .request-status.error {
        color: var(--red);
    }

    .categories {
        display: flex;
        gap: 7px;
        padding: 12px 15px;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        flex-shrink: 0;
    }

    .category-btn {
        white-space: nowrap;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: #bfc4c8;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
    }

    .category-btn.active {
        background: var(--accent);
        color: #111;
        border-color: var(--accent);
    }

    .menu-grid {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 15px;
        display: grid;
        grid-template-columns: repeat(4, minmax(130px, 1fr));
        gap: 10px;
        align-content: start;
    }

    .menu-card {
        min-height: 116px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 11px;
        padding: 13px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        color: var(--text);
        transition: .12s;
    }

    .menu-card:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
    }

    .menu-name {
        font-weight: 750;
        font-size: 13px;
        line-height: 1.3;
    }

    .menu-description {
        color: var(--muted);
        font-size: 10px;
        margin-top: 5px;
    }

    .menu-price {
        font-weight: 850;
        color: var(--accent2);
        font-size: 14px;
    }

    /* =====================================================
       RIGHT CART
    ===================================================== */

    .order-panel {
        border-left: 1px solid var(--border);
        background: #17191b;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .order-header {
        padding: 14px 17px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .order-number {
        font-size: 13px;
        font-weight: 850;
    }

    .order-mode {
        color: var(--accent2);
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 800;
    }

    .cart {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px;
    }

    .empty-cart {
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 30px;
    }

    .cart-item {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 11px;
        margin-bottom: 8px;
    }

    .cart-item-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
    }

    .cart-item-name {
        font-weight: 750;
        font-size: 13px;
    }

    .cart-item-price {
        color: var(--accent2);
        font-size: 12px;
        font-weight: 750;
        white-space: nowrap;
    }

    .cart-item-details {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.45;
        margin-top: 4px;
    }

    .cart-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 9px;
    }

    .qty-btn {
        width: 29px;
        height: 29px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel3);
        color: white;
        cursor: pointer;
    }

    .qty-number {
        min-width: 28px;
        text-align: center;
        font-size: 12px;
        font-weight: 800;
    }

    .remove-btn {
        margin-left: auto;
        border: 0;
        background: transparent;
        color: var(--red);
        cursor: pointer;
        font-size: 11px;
    }

    .totals {
        padding: 13px 16px;
        border-top: 1px solid var(--border);
    }

    .total-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #b9bec2;
        margin-bottom: 7px;
    }

    .total-row.grand {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        color: white;
        font-size: 18px;
        font-weight: 850;
    }

    .order-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 12px 16px 16px;
    }

    .action-btn {
        height: 45px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel2);
        color: #e7e8e9;
        font-weight: 750;
        font-size: 12px;
        cursor: pointer;
    }

    .action-btn:hover {
        border-color: #555d65;
    }

    .action-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #111;
        grid-column: span 2;
        height: 51px;
        font-size: 14px;
        font-weight: 900;
    }

    .action-btn.primary:disabled {
        background: #34383c;
        border-color: #34383c;
        color: #777;
        cursor: not-allowed;
    }

    /* =====================================================
       FOOTER
    ===================================================== */

    .statusbar {
        height: 31px;
        background: #0c0e0f;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        color: var(--muted);
        font-size: 10px;
        flex-shrink: 0;
    }

    .online {
        color: var(--green);
    }

    /* =====================================================
       MODALS
    ===================================================== */

    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 20px;
    }

    .modal {
        width: min(570px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        background: #1b1e21;
        border: 1px solid #41474d;
        border-radius: 14px;
        box-shadow: 0 25px 80px rgba(0,0,0,.5);
    }

    .modal-header {
        padding: 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .modal-title {
        font-weight: 850;
    }

    .modal-close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 22px;
        cursor: pointer;
    }

    .modal-body {
        padding: 18px;
    }

    .option-section {
        margin-bottom: 18px;
    }

    .option-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: .7px;
        margin-bottom: 8px;
    }

    .option-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 7px;
    }

    .option-btn {
        border: 1px solid var(--border);
        background: var(--panel);
        color: white;
        border-radius: 8px;
        padding: 11px;
        text-align: left;
        cursor: pointer;
        font-size: 12px;
    }

    .option-btn.selected {
        border-color: var(--accent);
        background: rgba(255,159,28,.12);
    }

    .modal-footer {
        padding: 14px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }

    .builder-total {
        font-size: 18px;
        font-weight: 900;
    }

    .confirm-btn {
        border: 0;
        background: var(--accent);
        color: #111;
        border-radius: 8px;
        height: 45px;
        padding: 0 22px;
        font-weight: 900;
        cursor: pointer;
    }

    .payment-methods {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 18px;
    }

    .payment-method {
        padding: 14px 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        font-weight: 750;
    }

    .payment-method.selected {
        border-color: var(--accent);
        background: rgba(255,159,28,.12);
    }

    .cash-input {
        width: 100%;
        height: 50px;
        background: #111315;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: white;
        padding: 0 13px;
        font-size: 18px;
        outline: none;
    }

    .cash-input:focus {
        border-color: var(--accent);
    }

    .change-box {
        margin-top: 10px;
        padding: 13px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 1100px) {
        .main {
            grid-template-columns: 230px 1fr 330px;
        }

        .menu-grid {
            grid-template-columns: repeat(3, minmax(120px, 1fr));
        }

        .top-stats {
            display: none;
        }
    }

    @media (max-width: 800px) {
        body {
            overflow: auto;
        }

        .main {
            grid-template-columns: 1fr;
            overflow: auto;
        }

        .queue-panel {
            display: none;
        }

        .order-panel {
            border-left: 0;
            min-height: 500px;
        }

        .workspace {
            min-height: 650px;
        }

        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
</style>
</head>

<body>

<div class="app">

    <!-- =================================================
         TOP BAR
    ================================================= -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-logo">
                RB
            </div>

            <div>
                <div class="brand-name">
                    RushBite
                </div>

                <div class="brand-sub">
                    POS TRAINING TERMINAL
                </div>
            </div>

        </div>

        <div class="top-stats">

            <div class="stat">
                <div class="stat-label">
                    Served
                </div>

                <div
                    class="stat-value"
                    id="servedCount"
                >
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Sales
                </div>

                <div
                    class="stat-value"
                    id="salesTotal"
                >
                    ₹0
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Current Order
                </div>

                <div
                    class="stat-value"
                    id="currentOrderNumber"
                >
                    #1001
                </div>
            </div>

        </div>

        <div
            class="clock"
            id="clock"
        >
            --:--:--
        </div>

    </header>


    <!-- =================================================
         MAIN
    ================================================= -->

    <main class="main">


        <!-- =============================================
             QUEUE
        ============================================= -->

        <aside class="queue-panel">

            <div class="panel-header">

                <div class="panel-title">
                    Customer Queue
                </div>

                <div
                    class="badge"
                    id="queueCount"
                >
                    0
                </div>

            </div>

            <div
                class="queue-list"
                id="queueList"
            >
            </div>

            <div class="queue-footer">

                <button
                    class="new-order-btn"
                    onclick="createCustomer()"
                >
                    + NEW CUSTOMER
                </button>

            </div>

        </aside>


        <!-- =============================================
             WORKSPACE
        ============================================= -->

        <section class="workspace">


            <!-- REQUEST -->

            <div class="request-area">

                <div
                    class="request-ticket"
                    id="requestTicket"
                >

                    <div class="request-label">
                        Incoming Order
                    </div>

                    <div
                        class="request-text"
                        id="requestText"
                    >
                        Waiting for customer...
                    </div>

                    <div
                        class="request-status"
                        id="requestStatus"
                    >
                        Enter the customer's order using the menu.
                    </div>

                </div>

            </div>


            <!-- CATEGORIES -->

            <div
                class="categories"
                id="categories"
            >
            </div>


            <!-- MENU -->

            <div
                class="menu-grid"
                id="menuGrid"
            >
            </div>


        </section>


        <!-- =============================================
             ORDER PANEL
        ============================================= -->

        <aside class="order-panel">

            <div class="order-header">

                <div>

                    <div
                        class="order-number"
                        id="orderNumber"
                    >
                        Order #1001
                    </div>

                    <div
                        class="order-mode"
                        id="orderMode"
                    >
                        DINE IN
                    </div>

                </div>

                <div class="badge">
                    OPEN
                </div>

            </div>


            <div
                class="cart"
                id="cart"
            >
            </div>


            <div class="totals">

                <div class="total-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0.00</span>
                </div>

                <div class="total-row">
                    <span>Tax</span>
                    <span id="tax">₹0.00</span>
                </div>

                <div class="total-row grand">
                    <span>Total</span>
                    <span id="total">₹0.00</span>
                </div>

            </div>


            <div class="order-actions">

                <button
                    class="action-btn"
                    onclick="clearCart()"
                >
                    Clear
                </button>

                <button
                    class="action-btn"
                    onclick="holdOrder()"
                >
                    Hold
                </button>

                <button
                    class="action-btn"
                    onclick="showHeldOrder()"
                >
                    Recall
                </button>

                <button
                    class="action-btn"
                    onclick="showDiscount()"
                >
                    Discount
                </button>

                <button
                    class="action-btn primary"
                    id="checkoutBtn"
                    onclick="openPayment()"
                    disabled
                >
                    CHECKOUT
                </button>

            </div>

        </aside>

    </main>


    <!-- =================================================
         STATUS BAR
    ================================================= -->

    <footer class="statusbar">

        <span>
            Register 04 · Training Mode
        </span>

        <span class="online">
            ● SYSTEM ONLINE
        </span>

    </footer>

</div>


<!-- =====================================================
     MODAL ROOT
===================================================== -->

<div id="modalRoot"></div>


<script>

/* =========================================================
   APPLICATION STATE
========================================================= */

const state = {

    categories: [
        "Burgers",
        "Meals",
        "Chicken",
        "Wraps",
        "Sides",
        "Drinks",
        "Shakes",
        "Cafe",
        "Desserts",
        "Breakfast",
        "Kids"
    ],

    activeCategory: "Burgers",

    cart: [],

    currentCustomer: null,

    queue: [],

    heldOrder: null,

    orderNumber: 1001,

    served: 0,

    sales: 0,

    taxRate: 0.05,

    discount: 0,

    nextCustomerTimer: null

};


/* =========================================================
   MENU
========================================================= */

const menu = [

    {
        id: "classic",
        name: "Classic Burger",
        category: "Burgers",
        price: 129,
        description: "Beef patty, lettuce, tomato"
    },

    {
        id: "cheese",
        name: "Cheeseburger",
        category: "Burgers",
        price: 149,
        description: "Classic burger with cheese"
    },

    {
        id: "double",
        name: "Double Cheeseburger",
        category: "Burgers",
        price: 199,
        description: "Two patties, double cheese"
    },

    {
        id: "crispy",
        name: "Crispy Chicken Burger",
        category: "Burgers",
        price: 179,
        description: "Crispy chicken, lettuce"
    },

    {
        id: "spicy",
        name: "Spicy Chicken Burger",
        category: "Burgers",
        price: 169,
        description: "Spicy chicken fillet"
    },


    /* MEALS */

    {
        id: "classic-meal",
        name: "Classic Burger Meal",

/* =========================================================
   UTILITY
========================================================= */

function random(array) {

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


function money(value) {

    return "₹" +
        Number(value).toFixed(2);

}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories() {

    const container =
        document.getElementById("categories");

    container.innerHTML = "";

    state.categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category-btn" +
            (
                state.activeCategory === category
                    ? " active"
                    : ""
            );

        button.textContent = category;

        button.onclick = () => {

            state.activeCategory = category;

            renderCategories();
            renderMenu();

        };

        container.appendChild(button);

    });

}


/* =========================================================
   MENU
========================================================= */

function renderMenu() {

    const grid =
        document.getElementById("menuGrid");

    grid.innerHTML = "";

    const items =
        menu.filter(
            item =>
                item.category ===
                state.activeCategory
        );

    if (!items.length) {

        grid.innerHTML =
            `<div style="
                color:#9299a1;
                padding:20px;
            ">
                No items available.
            </div>`;

        return;
    }

    items.forEach(item => {

        const card =
            document.createElement("button");

        card.className = "menu-card";

        card.onclick = () => {

            if (item.combo) {

                openComboBuilder(item);

            } else {

                addItem(item);

            }

        };

        card.innerHTML = `

            <div>

                <div class="menu-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="menu-description">
                    ${escapeHTML(item.description)}
                </div>

            </div>

            <div class="menu-price">
                ${money(item.price)}
            </div>

        `;

        grid.appendChild(card);

    });

}


/* =========================================================
   CART
========================================================= */

function addItem(item, modifiers = []) {

    const existing =
        state.cart.find(
            cartItem =>
                cartItem.id === item.id &&
                JSON.stringify(
                    cartItem.modifiers
                ) ===
                JSON.stringify(modifiers)
        );

    if (existing) {

        existing.quantity++;

    } else {

        state.cart.push({

            type: "item",

            id: item.id,

            name: item.name,

            price: item.price,

            quantity: 1,

            modifiers

        });

    }

    renderCart();

    validateOrder();

}


function changeQuantity(index, amount) {

    const item =
        state.cart[index];

    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {

        state.cart.splice(index, 1);

    }

    renderCart();

    validateOrder();

}


function removeItem(index) {

    state.cart.splice(index, 1);

    renderCart();

    validateOrder();

}


function clearCart() {

    state.cart = [];

    state.discount = 0;

    renderCart();

    validateOrder();

}

    if (!state.cart.length) {

        cart.innerHTML = `

                <div>

                </div>

    } else {

        cart.innerHTML = "";

            (item, index) => {

                const element =

                element.className =
                    "cart-item";

                const modifiers =

                element.innerHTML = `

                cart.appendChild(element);

            }
        );

    }

    updateTotals();

}


/* =========================================================
   TOTALS
========================================================= */

function getSubtotal() {

    return state.cart.reduce(
        (sum, item) =>
            sum +
            item.price *
            item.quantity,
        0
    );

}


function updateTotals() {

    const subtotal =
        getSubtotal();

    const discounted =
        Math.max(
            0,
            subtotal - state.discount
        );

    const tax =
        discounted *
        state.taxRate;

    const total =
        discounted + tax;

    document.getElementById(
        "subtotal"
    ).textContent =
        money(subtotal);

    document.getElementById(
        "tax"
    ).textContent =
        money(tax);

    document.getElementById(
        "total"
    ).textContent =
        money(total);

}

function selectCustomer(id) {

    const customer =
        state.queue.find(
            item =>
                item.id === id
        );

    if (!customer) return;

    state.currentCustomer =
        customer;

    state.cart = [];

    state.discount = 0;

    document.getElementById(
        "requestText"
    ).textContent =
        customer.request;

    document.getElementById(
        "orderMode"
    ).textContent =
        customer.mode.toUpperCase();

    document.getElementById(
        "requestTicket"
    ).className =
        "request-ticket";

    document.getElementById(
        "requestStatus"
    ).textContent =
        "Enter the customer's order using the menu.";

    document.getElementById(
        "requestStatus"
    ).className =
        "request-status";

    renderQueue();

    renderCart();

    validateOrder();

}


/* =========================================================
   VALIDATE ORDER
========================================================= */

function getExpectedItems() {

    if (!state.currentCustomer) {

        return [];

    }

    return state.currentCustomer.expected;

}


function validateOrder() {

    const status =
        document.getElementById(
            "requestStatus"
        );

    const ticket =
        document.getElementById(
            "requestTicket"
        );

    const checkout =
        document.getElementById(
            "checkoutBtn"
        );

    if (!state.currentCustomer) {

        checkout.disabled = true;

        return;

    }

    const expected =
        getExpectedItems();

    /*
     * For this training version we compare
     * the menu IDs and quantities.
     */

    let correct =
        true;

    let actualMap = {};

    state.cart.forEach(item => {

        actualMap[item.id] =
            (
                actualMap[item.id] || 0
            ) +
            item.quantity;

    });

    let expectedMap = {};

    expected.forEach(item => {

        expectedMap[item.menu] =
            (
                expectedMap[item.menu] || 0
            ) +
            (item.quantity || 1);

    });

    const actualKeys =
        Object.keys(actualMap);

    const expectedKeys =
        Object.keys(expectedMap);

    if (
        actualKeys.length !==
        expectedKeys.length
    ) {

        correct = false;

    }

    expectedKeys.forEach(key => {

        if (
            actualMap[key] !==
            expectedMap[key]
        ) {

            correct = false;

        }

    });

    if (
        correct &&
        state.cart.length
    ) {

        status.textContent =
            "✓ Order matches the customer's request. Ready for payment.";

        status.className =
            "request-status success";

        ticket.className =
            "request-ticket correct";

        checkout.disabled = false;

    } else {

        if (state.cart.length) {

            status.textContent =
                "Order does not match the request yet.";

        } else {

            status.textContent =
                "Enter the customer's order using the menu.";

        }

        status.className =
            "request-status error";

        ticket.className =
            "request-ticket incorrect";

        checkout.disabled = true;

    }

}

                                    onclick="
                                        toggleExtra(
                                            'cheese-extra',
                                            'Extra Cheese',
                                            25
                                        );
                                    "
                                >
                                    Extra Cheese +₹25
                                </button>

                                <button
                                    class="option-btn ${
                                        extras.some(
                                            x =>
                                                x.id ===
                                                "jalapeno"
                                        )
                                            ? "selected"
                                            : ""
                                    }"
                                    onclick="
                                        toggleExtra(
                                            'jalapeno',
                                            'Jalapeños',
                                            15
                                        );
                                    "
                                >
                                    Jalapeños +₹15
                                </button>

                            </div>

                        </div>

                    </div>


                    <div class="modal-footer">

                        <div>

                            <div style="
                                color:#9299a1;
                                font-size:10px;
                            ">
                                COMBO TOTAL
                            </div>

                            <div
                                class="builder-total"
                            >
                                ${money(price)}
                            </div>

                        </div>

                        <button
                            class="confirm-btn"
                            onclick="
                                confirmCombo(
                                    '${item.id}'
                                );
                            "
                        >
                            ADD TO ORDER
                        </button>

                    </div>

                </div>

            </div>

        `;

        window.currentCombo = {
            side,
            drink,
            extras
        };

    }


    window.comboSide =
        "fries-m";

    window.comboDrink =
        "coke-m";

    window.comboExtras = [];

    window.rebuildCombo = function() {

        side =
            window.comboSide;

        drink =
            window.comboDrink;

        extras =
            window.comboExtras;

        renderBuilder();

    };


    window.toggleExtra =
        function(id, name, price) {

            const index =
                extras.findIndex(
                    x => x.id === id
                );

            if (index >= 0) {

                extras.splice(index, 1);

            } else {

                extras.push({
                    id,
                    name,
                    price
                });

            }

            window.comboExtras =
                extras;

            renderBuilder();

        };


    window.confirmCombo =
        function(itemId) {

            const combo =
                menu.find(
                    x => x.id === itemId
                );

            let price =
                combo.price;

            if (
                window.comboSide ===
                "fries-l"
            ) {

                price += 20;

            }

            window.comboExtras.forEach(
                extra => {

                    price += extra.price;

                }
            );

            state.cart.push({

                type: "combo",

                id: combo.id,

                name: combo.name,

                price,

                quantity: 1,

                modifiers: [
                    "Fries: " +
                    (
                        window.comboSide ===
                        "fries-l"
                            ? "Large"
                            : "Medium"
                    ),

                    "Drink: " +
                    window.comboDrink,

                    ...window.comboExtras
                        .map(
                            x => x.name
                        )
                ]

            });

            closeModal();

            renderCart();

            validateOrder();

        };


    renderBuilder();

}


function closeModal() {

    document.getElementById(
        "modalRoot"
    ).innerHTML = "";

}


/* =========================================================
   PAYMENT
========================================================= */

function openPayment() {

    if (!state.currentCustomer) return;

    const subtotal =
        getSubtotal();

    const tax =
        Math.max(
            0,
            subtotal -
            state.discount
        ) *
        state.taxRate;

    const total =
        Math.max(
            0,
            subtotal -
            state.discount
        ) +
        tax;

    let method = "Card";

    const modal =
        document.getElementById(
            "modalRoot"
        );

    function renderPayment() {

        modal.innerHTML = `

            <div class="modal-backdrop">

                <div class="modal">

                    <div class="modal-header">

                        <div class="modal-title">
                            Payment
                        </div>

                        <button
                            class="modal-close"
                            onclick="closeModal()"
                        >
                            ×
                        </button>

                    </div>

                    <div class="modal-body">

                        <div style="
                            text-align:center;
                            margin-bottom:20px;
                        ">

                            <div style="
                                color:#9299a1;
                                font-size:11px;
                            ">
                                AMOUNT DUE
                            </div>

                            <div style="
                                font-size:34px;
                                font-weight:900;
                                margin-top:4px;
                            ">
                                ${money(total)}
                            </div>

                        </div>


                        <div class="payment-methods">

                            <button
                                class="payment-method ${
                                    method === "Cash"
                                        ? "selected"
                                        : ""
                                }"
                                onclick="
                                    method='Cash';
                                    renderPayment();
                                "
                            >
                                💵 Cash
                            </button>

                            <button
                                class="payment-method ${
                                    method === "Card"
                                        ? "selected"
                                        : ""
                                }"
                                onclick="
                                    method='Card';
                                    renderPayment();
                                "
                            >
                                💳 Card
                            </button>

                            <button
                                class="payment-method ${
                                    method === "UPI"
                                        ? "selected"
                                        : ""
                                }"
                                onclick="
                                    method='UPI';
                                    renderPayment();
                                "
                            >
                                📱 UPI
                            </button>

                        </div>


                        ${
                            method === "Cash"
                                ? `
                                <input
                                    class="cash-input"
                                    id="cashTendered"
                                    type="number"
                                    placeholder="Amount tendered"
                                    oninput="updateChange(
                                        ${total}
                                    )"
                                >

                                <div class="change-box">

                                    <span>
                                        Change
                                    </span>

                                    <strong
                                        id="changeAmount"
                                    >
                                        ₹0.00
                                    </strong>

                                </div>
                                `
                                : `
                                <div style="
                                    padding:18px;
                                    text-align:center;
                                    background:#202428;
                                    border-radius:8px;
                                    color:#9299a1;
                                ">
                                    ${method} payment ready
                                </div>
                                `
                        }

                    </div>


                    <div class="modal-footer">

                        <div style="
                            color:#9299a1;
                            font-size:11px;
                        ">
                            ${method}
                        </div>

                        <button
                            class="confirm-btn"
                            onclick="
                                completePayment(
                                    '${method}',
                                    ${total}
                                );
                            "
                        >
                            COMPLETE PAYMENT
                        </button>

                    </div>

                </div>

            </div>

        `;

    }

    window.updateChange =
        function(total) {

            const input =
                document.getElementById(
                    "cashTendered"
                );

            const change =
                document.getElementById(
                    "changeAmount"
                );

            if (!input || !change) return;

            const tendered =
                Number(input.value);

            const difference =
                tendered - total;

            change.textContent =
                money(
                    Math.max(
                        0,
                        difference
                    )
                );

        };


    window.completePayment =
        function(method, total) {

            if (method === "Cash") {

                const input =
                    document.getElementById(
                        "cashTendered"
                    );

                const tendered =
                    Number(
                        input?.value || 0
                    );

                if (tendered < total) {

                    alert(
                        "Insufficient cash."
                    );

                    return;

                }

            }

            state.served++;

            state.sales += total;

            const currentId =
                state.currentCustomer.id;

            state.queue =
                state.queue.filter(
                    customer =>
                        customer.id !==
                        currentId
                );

            state.currentCustomer =
                null;

            state.cart = [];

            state.discount = 0;

            closeModal();

            updateStats();

            renderCart();

            /*
             * Automatically bring in another
             * customer after the order is completed.
             */

            setTimeout(
                () => {

                    createCustomer();

                },
                650
            );

            document.getElementById(
                "requestText"
            ).textContent =
                "Order completed. Next customer arriving...";

            document.getElementById(
                "requestStatus"
            ).textContent =
                "Payment approved.";

            document.getElementById(
                "requestStatus"
            ).className =
                "request-status success";

            document.getElementById(
                "requestTicket"
            ).className =
                "request-ticket correct";

        };


    renderPayment();

}


/* =========================================================
   HOLD / RECALL
========================================================= */

function holdOrder() {

    if (
        !state.currentCustomer ||
        !state.cart.length
    ) {

        return;

    }

    state.heldOrder = {

        customer:
            state.currentCustomer,

        cart:
            JSON.parse(
                JSON.stringify(
                    state.cart
                )
            )

    };

    state.cart = [];

    renderCart();

    document.getElementById(
        "requestText"
    ).textContent =
        "Order placed on hold.";

}


function showHeldOrder() {

    if (!state.heldOrder) {

        alert(
            "There is no held order."
        );

        return;

    }

    state.currentCustomer =
        state.heldOrder.customer;

    state.cart =
        state.heldOrder.cart;

    state.heldOrder = null;

    document.getElementById(
        "requestText"
    ).textContent =
        state.currentCustomer.request;

    document.getElementById(
        "orderMode"
    ).textContent =
        state.currentCustomer.mode
            .toUpperCase();

    renderCart();

    validateOrder();

}


/* =========================================================
   DISCOUNT
========================================================= */

function showDiscount() {

    const code =
        prompt(
            "Enter discount code:\n\nSAVE10 = 10% off"
        );

    if (!code) return;

    if (
        code.trim().toUpperCase() ===
        "SAVE10"
    ) {

        state.discount =
            getSubtotal() * 0.10;

        updateTotals();

        return;

    }

    alert(
        "Invalid discount code."
    );

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    document.getElementById(
        "servedCount"
    ).textContent =
        state.served;

    document.getElementById(
        "salesTotal"
    ).textContent =
        money(state.sales);

    document.getElementById(
        "currentOrderNumber"
    ).textContent =
        "#" +
        state.orderNumber;

    document.getElementById(
        "orderNumber"
    ).textContent =
        "Order #" +
        state.orderNumber;

    state.orderNumber++;

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();

    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

}


setInterval(
    updateClock,
    1000
);


/* =========================================================
   PATIENCE TIMER
========================================================= */

setInterval(
    () => {

        state.queue.forEach(
            customer => {

                customer.patience =
                    Math.max(
                        0,
                        customer.patience -
                        0.5
                    );

            }
        );

        renderQueue();

    },
    1000
);


/* =========================================================
   START POS
========================================================= */

renderCategories();

renderMenu();

renderCart();

updateStats();

updateClock();

createInitialCustomers();

</script>

</body>
</html>
